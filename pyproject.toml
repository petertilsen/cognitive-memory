[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-memory"
version = "0.2.0"
description = "Advanced cognitive memory system for AI agents with human-like learning patterns"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cognitive Memory Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "chromadb>=1.3.0",
    "strands-agents>=0.1.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/petertilsen/cognitive-memory"
Repository = "https://github.com/petertilsen/cognitive-memory"
Documentation = "https://github.com/petertilsen/cognitive-memory#readme"
Issues = "https://github.com/petertilsen/cognitive-memory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognitive_memory*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
